<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cake Tagger · Review</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/src/client/review.css"><script type="module" src="/src/client/review.mjs"></script></head>
<body><main>
<header><div class="brand"><img src="/assets/logo.svg" alt="" width="36" height="36"><strong>Cake Tagger</strong><span data-i18n="review.title"></span></div><select id="language" data-i18n-aria-label="settings.language"><option value="de">Deutsch</option><option value="en">English</option></select></header>
<section class="toolbar"><label class="file-button"><span data-i18n="review.files"></span><input id="files" type="file" accept="video/*,.m4v" multiple></label><label><span data-i18n="settings.frames"></span><select id="frames"><option value="auto" data-i18n="settings.autoFrames"></option><option>8</option><option>12</option><option>16</option><option>24</option><option>32</option><option>48</option></select></label><button id="analyze" data-i18n="analysis.start" disabled></button><button id="cancel" data-i18n="analysis.cancel" hidden></button><button id="export" data-i18n="export.download" disabled></button><a id="download-link" hidden data-i18n="review.downloadLink"></a><button id="server-export" hidden data-i18n="review.alternative"></button><a id="server-link" hidden data-i18n="review.downloadLink"></a></section>
<p id="status" role="status" data-i18n="review.intro"></p>
<section class="comparison"><div><strong data-i18n="review.comparison"></strong><p data-i18n="review.comparisonHint"></p></div><label><span data-i18n="review.threshold"></span><input id="threshold" type="number" min="0.01" max="1" step="0.01" value="0.5"></label><label><span data-i18n="review.coverage"></span><input id="coverage" type="number" min="1" max="100" step="1" value="50"></label><p id="metrics"></p></section>
<div class="workspace"><nav id="queue" data-i18n-aria-label="review.files"></nav><section id="editor" hidden><div class="video-heading"><h1 id="filename"></h1><label><input id="reviewed" type="checkbox"><span data-i18n="review.reviewed"></span></label></div><video id="player" controls preload="metadata" playsinline></video><div class="tag-tools"><input id="search" type="search" data-i18n-placeholder="review.search"><label><input id="all" type="checkbox"><span data-i18n="review.allTags"></span></label><span id="counts"></span></div><div class="table-scroll"><table><thead><tr><th data-i18n="review.selected"></th><th data-i18n="review.baseline"></th><th data-i18n="review.candidate"></th><th data-i18n="review.score"></th><th data-i18n="review.support"></th></tr></thead><tbody id="tags"></tbody></table></div></section></div>
<footer data-i18n="review.footer"></footer>
</main></body></html>
