<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cake Tagger · Review</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/src/client/review.css"><script type="module" src="/src/client/review.mjs"></script></head>
<body><main>
<header><div class="brand"><img src="/assets/logo.svg" alt="" width="36" height="36"><strong>Cake Tagger</strong><span data-i18n="review.title"></span></div><select id="language" data-i18n-aria-label="settings.language"><option value="de">Deutsch</option><option value="en">English</option></select></header>
<section id="resume" class="notice" hidden><p id="resume-text"></p><button id="restore" data-i18n="review.restore"></button><button id="discard" data-i18n="review.discard"></button></section>
<section class="toolbar">
<label class="file-button"><span data-i18n="review.files"></span><input id="files" type="file" accept="video/*,.m4v" multiple></label>
<details class="session-options"><summary data-i18n="review.sessionOptions"></summary><div class="session-menu"><label class="file-button secondary"><span data-i18n="review.import"></span><input id="import" type="file" accept=".json,application/json"></label>
<label><span data-i18n="settings.frames"></span><select id="frames"><option value="auto" data-i18n="settings.autoFrames"></option><option>4</option><option>6</option><option>8</option><option>12</option><option>16</option><option>24</option><option>32</option><option>48</option></select></label>
<button id="save" data-i18n="review.save"></button><button id="clear" data-i18n="review.clear"></button></div></details>
<button id="analyze" data-i18n="analysis.start" disabled></button><button id="cancel" data-i18n="analysis.cancel" hidden></button>
<button id="export" data-i18n="export.download" disabled></button>
<a id="download-link" hidden data-i18n="review.downloadLink"></a><button id="server-export" hidden data-i18n="review.alternative"></button><a id="server-link" hidden data-i18n="review.downloadLink"></a>
</section><div class="status-line"><p id="status" role="status" data-i18n="review.intro"></p><p id="save-status" role="status"></p></div>
<div class="view-tabs" role="tablist" data-i18n-aria-label="review.views"><button id="tab-review" role="tab" aria-controls="view-review" aria-selected="true" data-i18n="review.reviewView"></button><button id="tab-compare" role="tab" aria-controls="view-compare" aria-selected="false" tabindex="-1" data-i18n="review.comparison"></button><button id="tab-problems" role="tab" aria-controls="view-problems" aria-selected="false" tabindex="-1" data-i18n="review.problems"></button><span id="progress"></span></div><div class="tag-tools"><label><span data-i18n="review.scope"></span><select id="scope"><option value="development" data-i18n="review.development"></option><option value="holdout" data-i18n="review.holdout"></option></select></label><label><input id="reveal" type="checkbox"><span data-i18n="review.reveal"></span></label></div>
<section id="view-compare" class="lab" role="tabpanel" aria-labelledby="tab-compare" hidden><h2 data-i18n="review.comparison"></h2>
<p data-i18n="review.comparisonHint"></p><div class="variants">
<fieldset><legend data-i18n="review.variantA"></legend><label><span data-i18n="review.threshold"></span><input id="threshold" type="number" min=".01" max="1" step=".01" value=".5"></label><label><span data-i18n="review.coverage"></span><input id="coverage" type="number" min="1" max="100" step="1" value="50"></label></fieldset>
<fieldset><legend data-i18n="review.variantB"></legend><label><span data-i18n="review.threshold"></span><input id="threshold-b" type="number" min=".01" max="1" step=".01" value=".65"></label><label><span data-i18n="review.coverage"></span><input id="coverage-b" type="number" min="1" max="100" step="1" value="50"></label></fieldset>
</div>
<p id="split-counts"></p><p id="metrics"></p><p id="delta"></p><div id="variant-changes" class="examples"></div><p class="hint" data-i18n="review.holdoutHint"></p>
</section>
<section id="view-problems" class="lab" role="tabpanel" aria-labelledby="tab-problems" hidden><h2 data-i18n="review.problems"></h2><div class="tag-tools"><label><span data-i18n="review.source"></span><select id="problem-source"><option value="current" data-i18n="review.baseline"></option><option value="A" data-i18n="review.variantA"></option><option value="B" data-i18n="review.variantB"></option></select></label></div>
<p id="problem-empty"></p><div class="table-scroll"><table><thead><tr><th data-i18n="review.tag"></th><th data-i18n="review.wrong"></th><th data-i18n="review.missed"></th><th data-i18n="review.examples"></th></tr></thead><tbody id="problems"></tbody></table></div></section>
<div id="view-review" class="workspace" role="tabpanel" aria-labelledby="tab-review"><section id="empty" class="lab" data-i18n="review.empty"></section><nav id="queue" data-i18n-aria-label="review.files"></nav><section id="editor" hidden>
<div class="video-heading"><h1 id="filename"></h1><label><input id="reviewed" type="checkbox"><span data-i18n="review.reviewed"></span></label></div>
<div class="tag-tools"><label><span data-i18n="review.partition"></span><select id="partition"><option value="auto" data-i18n="review.autoPartition"></option><option value="development" data-i18n="review.development"></option><option value="holdout" data-i18n="review.holdout"></option></select></label><span id="resolved-partition"></span></div>
<div class="review-body"><div class="video-column"><p id="reconnect" class="notice" hidden data-i18n="review.reconnect"></p><video id="player" controls preload="metadata" playsinline></video></div><div class="judgments">
<div class="tag-tools"><input id="search" type="search" data-i18n-placeholder="review.search"><label><input id="all" type="checkbox"><span data-i18n="review.allTags"></span></label><span id="counts"></span><label><input id="comparison-columns" type="checkbox"><span data-i18n="review.details"></span></label></div>
<div class="table-scroll"><table><thead><tr><th data-i18n="review.tag"></th><th data-i18n="review.verdict"></th><th data-i18n="review.confidence"></th><th class="comparison-column" data-i18n="review.baseline"></th><th class="comparison-column" data-i18n="review.variantA"></th><th class="comparison-column" data-i18n="review.variantB"></th><th class="comparison-column" data-i18n="review.support"></th></tr></thead><tbody id="tags"></tbody></table></div>
</div></div><div class="review-navigation"><button id="previous" data-i18n="review.previous"></button><button id="next" data-i18n="review.next"></button><button id="complete-next" data-i18n="review.completeNext"></button></div>
</section></div><section id="evidence" aria-labelledby="evidence-title" hidden><div class="video-heading"><h2 id="evidence-title"></h2><button id="evidence-close" data-i18n="review.closeEvidence"></button></div><p data-i18n="review.evidenceHint"></p>
<div id="evidence-frames"></div><details class="rule-options"><summary data-i18n="review.editRule"></summary><div class="tag-tools"><label><span data-i18n="review.ruleVariant"></span><select id="rule-variant"><option>A</option><option>B</option></select></label><label><span data-i18n="review.threshold"></span><input id="tag-threshold" type="number" min=".01" max="1" step=".01"></label><label><span data-i18n="review.coverage"></span><input id="tag-coverage" type="number" min="1" max="100" step="1"></label><button id="rule-save" data-i18n="review.saveRule"></button><button id="rule-reset" data-i18n="review.resetRule"></button></div>
<p id="rule-state"></p></details></section>
<footer data-i18n="review.footer"></footer>
</main></body></html>
