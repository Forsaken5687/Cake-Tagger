<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Cake Tagger</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <header class="app-header">
    <a class="brand" href="#" aria-label="Cake Tagger home" data-i18n-aria-label="page.home"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="var(--panel)"/>
  <path d="M19 12h17a6 6 0 0 1 4.24 1.76l12 12a6 6 0 0 1 0 8.48L34.24 51.24a6 6 0 0 1-8.48 0l-12-12A6 6 0 0 1 12 35V19a7 7 0 0 1 7-7Z" fill="var(--text)"/>
  <circle cx="22" cy="22" r="4" fill="var(--panel)"/>
  <path d="m27 34 6 6 11-12" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 12h5v5" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Cake<span class="brand-light">Tagger</span></span></a>
    <button id="quit" class="quiet small-button" data-i18n="action.quit">Quit</button>
  </header>
  <section class="intro" aria-labelledby="page-title">
    <h1 id="page-title" data-i18n="page.title">Tag videos</h1>
    <p data-i18n="page.description">Tag suggestions for your videos.</p>
  </section>
  <section class="panel" aria-labelledby="upload-title">
    <div class="panel-heading"><h2 id="upload-title" data-i18n="upload.title">New videos</h2><div class="status"><span class="dot" aria-hidden="true"></span><span id="status" role="status" aria-live="polite" data-i18n="analysis.connecting">Checking connection …</span></div></div>
    <div class="upload-layout">
      <label class="drop" id="drop">
        <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></span>
        <strong data-i18n="upload.drop">Drop videos here</strong><span data-i18n="upload.chooseHint">or click to choose files</span><span class="file-types">MP4 · M4V · WebM · MOV</span>
        <input id="files" type="file" aria-label="Choose videos" data-i18n-aria-label="upload.choose" accept="video/*,.m4v" multiple>
      </label>
      <div class="analysis-options">
        <button id="analyze" disabled><span data-i18n="analysis.start">Suggest tags</span> <span aria-hidden="true">↗</span></button>
        <button id="cancel" class="quiet" hidden data-i18n="analysis.cancel">Cancel analysis</button>
      </div>
    </div>
  </section>
  <div id="message" role="status" aria-live="polite"></div>
  <div class="results-heading"><div><h2 data-i18n="results.title">Videos &amp; tags</h2></div><span id="summary" data-i18n="error.noVideosSelected">No videos selected.</span></div>
  <section id="results" aria-label="Video results" data-i18n-aria-label="results.label"></section>
  <footer class="export-bar">
    <div class="export-description"><strong>Export</strong><span class="export-hint" data-i18n="export.description">Download selected tags as JSON.</span></div>
    <div class="export-actions"><button id="export" disabled><span data-i18n="export.download">Download JSON</span> <span aria-hidden="true">↓</span></button></div>
  </footer>
  <div class="page-footer"><span>Cake Tagger</span><span data-i18n="page.sessionHint">Results stay in this session until the page is reloaded.</span></div>
</main>
</body>
</html>
